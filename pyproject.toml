[project]
name = "mintrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BasharMithan", email = "basharmithan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mintrag = "mintrag:main"

[tool.pytest.ini_options]
testpaths = ["src/mintrag/tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test*"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
